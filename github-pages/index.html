<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="5; url=__VERCEL_APP_URL__" />
    <title>AutoUpload Shorts</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at top left, #7f1d1d, transparent 32%), #08090f; color: #f8fafc; }
      main { width: min(720px, calc(100% - 32px)); border: 1px solid rgba(255,255,255,.12); border-radius: 32px; background: rgba(255,255,255,.07); padding: 32px; box-shadow: 0 24px 80px rgba(0,0,0,.4); }
      .eyebrow { color: #fecaca; text-transform: uppercase; letter-spacing: .25em; font-size: 12px; }
      h1 { font-size: clamp(36px, 8vw, 64px); line-height: .95; margin: 16px 0; }
      p { color: #cbd5e1; font-size: 18px; line-height: 1.7; }
      a { display: inline-flex; margin-top: 18px; border-radius: 999px; background: #ef4444; color: white; padding: 14px 20px; font-weight: 800; text-decoration: none; }
      code { display: block; overflow-x: auto; margin-top: 18px; border-radius: 16px; background: rgba(0,0,0,.35); padding: 14px; color: #fff; }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">GitHub Pages launcher</div>
      <h1>Open the working AutoUpload app on Vercel.</h1>
      <p>
        YouTube OAuth and video publishing require server-side API routes, so the full app runs on Vercel. This GitHub Pages page is a static launcher and will redirect automatically.
      </p>
      <a href="__VERCEL_APP_URL__">Open Vercel app</a>
      <code>__VERCEL_APP_URL__</code>
    </main>
  </body>
</html>
